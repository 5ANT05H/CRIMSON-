<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0f111a;
  color:white;
}

/* LOGIN */
.login{
  width:340px;
  margin:120px auto;
  background:#1c1f2b;
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
  text-align:center;
}

.login h2{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  outline:none;
  border-radius:8px;
  background:#2a2d3d;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00d4ff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00aacc;
}

/* DASHBOARD */
.dashboard{
  display:none;
}

.sidebar{
  width:220px;
  height:100vh;
  background:#1c1f2b;
  position:fixed;
  top:0;
  left:0;
  padding:20px;
}

.sidebar h3{
  margin-bottom:20px;
}

.sidebar button{
  margin-top:10px;
}

.main{
  margin-left:240px;
  padding:20px;
}

.card{
  background:#1c1f2b;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login" id="loginBox">
  <h2>🔐 PRO LOGIN</h2>
  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="sidebar">
    <h3>⚡ MENU</h3>
    <p>Home</p>
    <p>Analytics</p>
    <p>Settings</p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main">
    <h1>🔥 Welcome Back</h1>

    <div class="card">
      <h3>System Status</h3>
      <p>All servers running fine 🚀</p>
    </div>

    <div class="card">
      <h3>Users</h3>
      <p>Active Users: 128</p>
    </div>

    <div class="card">
      <h3>Performance</h3>
      <p>Speed: 99.9% ⚡</p>
    </div>

  </div>

</div>

<script>

// auto login check
window.onload = function(){
  if(localStorage.getItem("loggedIn") === "true"){
    showDashboard();
  }
}

function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === "admin" && p === "1234"){
    localStorage.setItem("loggedIn","true");
    showDashboard();
  }else{
    alert("❌ Wrong Login");
  }
}

function showDashboard(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}

function logout(){
  localStorage.removeItem("loggedIn");
  location.reload();
}

</script>

</body>
</html>
